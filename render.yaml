services:
  - type: web
    name: bingooo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      # Set to "supabase" in the dashboard AFTER running
      # supabase/migrations/004_app_records.sql (the API refuses to boot
      # with DATA_STORE=supabase if the app_records table is missing).
      - key: DATA_STORE
        sync: false
      - key: PORT
        value: "8080"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        value: "https://zqmrmgwxhrdscippanuv.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_fHCORRNjkuYGufRUUdvHtw_T5VFXWpl"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
